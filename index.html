<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TaskFlow: a team task board with role-based access." />
    <title>TaskFlow</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Installable: add to home screen. No service worker, so there is no offline cache to go stale. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Match --bg in styles.css (and the manifest's colours). -->
    <meta name="theme-color" data-scheme="light" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" data-scheme="dark" content="#0f1117" media="(prefers-color-scheme: dark)" />
    <!-- Apply a saved light/dark choice before the first paint (see src/client/theme.tsx). -->
    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
